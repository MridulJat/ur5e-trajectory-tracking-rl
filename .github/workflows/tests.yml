name: tests

on:
  push:
    branches: [main, ci-setup]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip

      - name: Install system dependencies for headless MuJoCo
        run: |
          sudo apt-get update
          sudo apt-get install -y libgl1 libglew-dev libosmesa6-dev patchelf

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        env:
          MUJOCO_GL: osmesa
          PYOPENGL_PLATFORM: osmesa
        run: pytest tests/ -v --durations=10
